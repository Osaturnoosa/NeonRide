    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --text-primary: #e0e0ff;
            --text-secondary: #8888bb;
            --cyan: #00f0ff;
            --magenta: #ff00d4;
            --yellow: #ffe600;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.3);
            --glow-magenta: 0 0 20px rgba(255, 0, 212, 0.3);
            --border-neon: 1px solid rgba(0, 240, 255, 0.2);
            --bg-card: #12121a;
            --bg-input: #0a0a0f;
            --shadow: rgba(0,240,255,0.1);
        }
        body.light-theme {
            --bg-primary: #f0f0ff;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #444466;
            --bg-card: #ffffff;
            --bg-input: #f0f0ff;
            --border-neon: 1px solid #00f0ff;
            --shadow: rgba(0,0,0,0.1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }
        a {
            color: var(--cyan);
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: var(--magenta);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            padding: 20px 0;
            border-bottom: var(--border-neon);
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background 0.3s, border-color 0.3s;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            max-width: 1200px;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--glow-cyan);
        }
        .nav-links {
            display: flex;
            gap: 30px;
            font-weight: 400;
            font-size: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-secondary);
            transition: 0.3s;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--cyan);
            transition: width 0.3s;
            box-shadow: var(--glow-cyan);
        }
        .nav-links a:hover {
            color: #fff;
        }
        body.light-theme .nav-links a:hover {
            color: #000;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .theme-toggle {
            background: transparent;
            border: var(--border-neon);
            border-radius: 20px;
            padding: 6px 14px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle:hover {
            background: var(--cyan);
            color: #0a0a0f;
        }
        .cart-icon {
            font-size: 1.4rem;
            color: var(--text-secondary);
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }
        .cart-icon:hover {
            color: var(--cyan);
            transform: scale(1.1);
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--magenta);
            color: #fff;
            font-size: 0.7rem;
            border-radius: 50%;
            padding: 2px 6px;
            font-weight: 700;
            box-shadow: var(--glow-magenta);
        }
        .page-header {
            padding: 60px 0 30px;
            text-align: center;
        }
        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, var(--cyan) 70%, var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.light-theme .page-header h1 {
            background: linear-gradient(135deg, #1a1a2e 30%, var(--cyan) 70%, var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-top: 10px;
        }
        .compare-content {
            padding: 20px 0 60px;
        }
        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .compare-card {
            background: var(--bg-card);
            border: var(--border-neon);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px var(--shadow);
            transition: 0.3s;
        }
        .compare-card:hover {
            transform: translateY(-5px);
            border-color: var(--cyan);
        }
        .compare-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            background: #1a1a2e;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .compare-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 1.2rem;
        }
        .compare-card .price {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--yellow);
            margin: 8px 0;
        }
        .compare-card .specs {
            text-align: left;
            margin-top: 12px;
        }
        .compare-card .specs div {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem;
        }
        body.light-theme .compare-card .specs div {
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .compare-card .specs .label {
            color: var(--text-secondary);
        }
        .compare-card .specs .value {
            font-weight: 500;
        }
        .compare-empty {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }
        .compare-empty .btn-primary {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 40px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #0a0a0f;
            background: var(--cyan);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: var(--glow-cyan);
        }
        .compare-empty .btn-primary:hover {
            background: var(--magenta);
            box-shadow: var(--glow-magenta);
            transform: scale(1.05);
        }
        .btn-remove-compare {
            background: transparent;
            border: 1px solid #ff0044;
            color: #ff0044;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.3s;
        }
        .btn-remove-compare:hover {
            background: #ff0044;
            color: #fff;
        }
        .footer {
            margin-top: auto;
            padding: 40px 0 20px;
            border-top: var(--border-neon);
            background: var(--bg-secondary);
            transition: background 0.3s, border-color 0.3s;
        }
        .footer .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 30px;
        }
        .footer-col h4 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .footer-col p,
        .footer-col a {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 6px;
        }
        .footer-col a:hover {
            color: var(--cyan);
        }
        .footer-bottom {
            text-align: center;
            padding-top: 30px;
            border-top: var(--border-neon);
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .glitch-text {
            display: inline-block;
            position: relative;
        }
        .glitch-text:hover {
            animation: glitch 0.3s ease-in-out;
        }
        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(2deg) translateX(2px); color: var(--magenta); }
            40% { transform: skew(-2deg) translateX(-2px); color: var(--cyan); }
            60% { transform: skew(1deg) translateX(1px); }
            80% { transform: skew(-1deg) translateX(-1px); }
            100% { transform: skew(0deg); }
        }
        @media (max-width: 768px) {
            .nav-links { gap: 15px; font-size: 0.9rem; flex-wrap: wrap; }
            .logo { font-size: 1.4rem; }

            .compare-grid { grid-template-columns: 1fr 1fr; }
            .theme-toggle { padding: 4px 10px; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .navbar .container { flex-direction: column; gap: 15px; }
            .compare-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        function getCompareList() {
            return JSON.parse(localStorage.getItem('compareList') || '[]');
        }

        function renderCompare() {
            const container = document.getElementById('compareContainer');
            const ids = getCompareList();
            if (ids.length === 0) {
                container.innerHTML = `
                    <div class="compare-empty">
                        <p>Вы не выбрали товары для сравнения</p>
                        <a href="Store.html" class="btn-primary">Перейти в магазин</a>
                    </div>
                `;
                return;
            }
            const items = allProducts.filter(p => ids.includes(p.id));
            if (items.length === 0) {
                container.innerHTML = `<div class="compare-empty"><p>Выбранные товары не найдены</p></div>`;
                return;
            }
            let html = `<div class="compare-grid">`;
            items.forEach(p => {
                html += `
                    <div class="compare-card">
                        <img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'" />
                        <h3>${p.name}</h3>
                        <div class="price">${p.price}</div>
                        <div class="specs">
                            ${p.specs ? p.specs.map(s => `<div><span class="label">${s.label}</span><span class="value">${s.value}</span></div>`).join('') : ''}
                        </div>
                        <button class="btn-remove-compare" data-id="${p.id}">Убрать</button>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;

            document.querySelectorAll('.btn-remove-compare').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    let list = getCompareList();
                    list = list.filter(i => i !== id);
                    localStorage.setItem('compareList', JSON.stringify(list));
                    renderCompare();
                });
            });
        }

        renderCompare();

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const badge = document.getElementById('cartBadge');
            if (badge) {
                const total = cart.reduce((sum, item) => sum + item.quantity, 0);
                badge.textContent = total;
            }
        }
        updateCartBadge();
        window.addEventListener('focus', updateCartBadge);

        (function() {
            const toggle = document.getElementById('themeToggle');
            const current = localStorage.getItem('theme') || 'dark';
            if (current === 'light') {
                document.body.classList.add('light-theme');
                toggle.textContent = '☀️ Тема';
            } else {
                toggle.textContent = '🌙 Тема';
            }
            toggle.addEventListener('click', function() {
                document.body.classList.toggle('light-theme');
                const isLight = document.body.classList.contains('light-theme');
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
                this.textContent = isLight ? '☀️ Тема' : '🌙 Тема';
            });
        })();
    </script>
</body>
</html>
