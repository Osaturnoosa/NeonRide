<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeonRide — Акции</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --text-primary: #e0e0ff;
            --text-secondary: #8888bb;
            --cyan: #00f0ff;
            --magenta: #ff00d4;
            --yellow: #ffe600;
            --red: #ff0044;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.3);
            --glow-magenta: 0 0 20px rgba(255, 0, 212, 0.3);
            --border-neon: 1px solid rgba(0, 240, 255, 0.2);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: var(--cyan);
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: var(--magenta);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            padding: 20px 0;
            border-bottom: var(--border-neon);
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--glow-cyan);
        }
        .nav-links {
            display: flex;
            gap: 30px;
            font-weight: 400;
            font-size: 1rem;
        }
        .nav-links a {
            color: var(--text-secondary);
            transition: 0.3s;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--cyan);
            transition: width 0.3s;
            box-shadow: var(--glow-cyan);
        }
        .nav-links a:hover {
            color: #fff;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .cart-icon {
            font-size: 1.4rem;
            color: var(--text-secondary);
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }
        .cart-icon:hover {
            color: var(--cyan);
            transform: scale(1.1);
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--magenta);
            color: #fff;
            font-size: 0.7rem;
            border-radius: 50%;
            padding: 2px 6px;
            font-weight: 700;
            box-shadow: var(--glow-magenta);
        }
        .page-header {
            padding: 60px 0 30px;
            text-align: center;
        }
        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, var(--red) 70%, var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-header p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-top: 10px;
        }
        .products {
            padding: 30px 0 60px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: var(--bg-secondary);
            border: var(--border-neon);
            border-radius: 8px;
            padding: 20px;
            transition: 0.4s;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }
        .product-card:hover {
            border-color: var(--cyan);
            box-shadow: var(--glow-cyan);
            transform: translateY(-8px);
        }
        .product-card .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--red);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 0, 68, 0.5);
            z-index: 2;
        }
        .product-card .image {
            width: 100%;
            height: 200px;
            background: #1a1a2e;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-card .image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a1a2e;
        }
        .product-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 1.2rem;
        }
        .product-card .desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 8px 0 12px;
            flex: 1;
        }
        .product-card .price {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--yellow);
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.2);
        }
        .product-card .old-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--text-secondary);
            text-decoration: line-through;
            margin-bottom: 15px;
        }
        .product-card .btn-buy {
            padding: 12px 24px;
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            align-self: flex-start;
        }
        .product-card .btn-buy:hover {
            background: var(--cyan);
            color: #0a0a0f;
            box-shadow: var(--glow-cyan);
        }
        .no-products {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }
        .footer {
            margin-top: auto;
            padding: 40px 0 20px;
            border-top: var(--border-neon);
            background: var(--bg-secondary);
        }
        .footer .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 30px;
        }
        .footer-col h4 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .footer-col p,
        .footer-col a {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 6px;
        }
        .footer-col a:hover {
            color: var(--cyan);
        }
        .footer-bottom {
            text-align: center;
            padding-top: 30px;
            border-top: var(--border-neon);
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .glitch-text {
            display: inline-block;
            position: relative;
        }
        .glitch-text:hover {
            animation: glitch 0.3s ease-in-out;
        }
        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(2deg) translateX(2px); color: var(--magenta); }
            40% { transform: skew(-2deg) translateX(-2px); color: var(--cyan); }
            60% { transform: skew(1deg) translateX(1px); }
            80% { transform: skew(-1deg) translateX(-1px); }
            100% { transform: skew(0deg); }
        }
        @media (max-width: 768px) {
            .nav-links { gap: 15px; font-size: 0.9rem; }
            .logo { font-size: 1.4rem; }
            .page-header h1 { font-size: 2.2rem; }
        }
        @media (max-width: 480px) {
            .navbar .container { flex-direction: column; gap: 15px; }
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--bg-secondary);
            border: var(--border-neon);
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.15);
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 2rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            font-family: inherit;
        }
        .modal-close:hover {
            color: var(--cyan);
            transform: rotate(90deg);
        }
        .modal .image {
            width: 100%;
            height: 280px;
            background: #1a1a2e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal .image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a1a2e;
        }
        .modal h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .modal .modal-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--yellow);
            margin-bottom: 16px;
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.2);
        }
        .modal .modal-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }
        .modal .specs-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--cyan);
            margin: 20px 0 12px;
            letter-spacing: 1px;
        }
        .modal .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
            background: var(--bg-primary);
            border-radius: 6px;
            padding: 16px 20px;
            border: var(--border-neon);
        }
        .modal .specs-grid .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .modal .specs-grid .spec-item .label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .modal .specs-grid .spec-item .value {
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .modal .reviews-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--magenta);
            margin: 24px 0 12px;
            letter-spacing: 1px;
        }
        .modal .review {
            background: var(--bg-primary);
            border-radius: 6px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 3px solid var(--cyan);
        }
        .modal .review .review-author {
            font-weight: 700;
            color: var(--cyan);
            font-size: 0.95rem;
        }
        .modal .review .review-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .modal .btn-buy-modal {
            margin-top: 24px;
            padding: 14px 40px;
            background: var(--cyan);
            border: none;
            border-radius: 4px;
            color: #0a0a0f;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: var(--glow-cyan);
        }
        .modal .btn-buy-modal:hover {
            background: var(--magenta);
            box-shadow: var(--glow-magenta);
            transform: scale(1.03);
        }
        @media (max-width: 600px) {
            .modal { padding: 24px; }
            .modal .specs-grid { grid-template-columns: 1fr; }
            .modal h2 { font-size: 1.5rem; }
            .modal .image { height: 180px; }
        }
    </style>
</head>
<body>

        <div class="container">
            <div class="logo">NeonRide</div>
            <nav class="nav-links">
                <a href="index.html">Главная</a>

                <a href="Cart.html">Корзина</a>

                <span class="cart-badge" id="cartBadge">0</span>

        <div class="container">

        </div>

    <section class="products">
        <div class="container">
            <div class="product-grid" id="saleGrid"></div>
        </div
