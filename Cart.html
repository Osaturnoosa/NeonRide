<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeonRide — Корзина</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --text-primary: #e0e0ff;
            --text-secondary: #8888bb;
            --cyan: #00f0ff;
            --magenta: #ff00d4;
            --yellow: #ffe600;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.3);
            --glow-magenta: 0 0 20px rgba(255, 0, 212, 0.3);
            --border-neon: 1px solid rgba(0, 240, 255, 0.2);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: var(--cyan);
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: var(--magenta);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .navbar {
            padding: 20px 0;
            border-bottom: var(--border-neon);
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            max-width: 1200px;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--glow-cyan);
        }
        .nav-links {
            display: flex;
            gap: 30px;
            font-weight: 400;
            font-size: 1rem;
        }
        .nav-links a {
            color: var(--text-secondary);
            transition: 0.3s;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--cyan);
            transition: width 0.3s;
            box-shadow: var(--glow-cyan);
        }
        .nav-links a:hover {
            color: #fff;
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .cart-icon {
            font-size: 1.4rem;
            color: var(--text-secondary);
            transition: 0.3s;
            position: relative;
            cursor: pointer;
        }
        .cart-icon:hover {
            color: var(--cyan);
            transform: scale(1.1);
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--magenta);
            color: #fff;
            font-size: 0.7rem;
            border-radius: 50%;
            padding: 2px 6px;
            font-weight: 700;
            box-shadow: var(--glow-magenta);
        }
        .cart-header {
            padding: 40px 0 20px;
            text-align: center;
        }
        .cart-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #fff 30%, var(--cyan) 70%, var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .cart-content {
            padding: 20px 0 60px;
        }
        .cart-empty {
            text-align: center;
            padding: 60px 0;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }
        .cart-empty .btn-primary {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 40px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #0a0a0f;
            background: var(--cyan);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: var(--glow-cyan);
        }
        .cart-empty .btn-primary:hover {
            background: var(--magenta);
            box-shadow: var(--glow-magenta);
            transform: scale(1.05);
        }
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .cart-item {
            background: var(--bg-secondary);
            border: var(--border-neon);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            transition: 0.3s;
        }
        .cart-item:hover {
            border-color: var(--cyan);
            box-shadow: var(--glow-cyan);
        }
        .cart-item .item-info {
            flex: 1;
            min-width: 150px;
        }
        .cart-item .item-info h3 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            font-size: 1.1rem;
        }
        .cart-item .item-info .item-price {
            color: var(--yellow);
            font-weight: 700;
            font-size: 1.1rem;
        }
        .cart-item .item-qty {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cart-item .item-qty button {
            background: transparent;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-item .item-qty button:hover {
            background: var(--cyan);
            color: #0a0a0f;
        }
        .cart-item .item-qty span {
            font-size: 1.2rem;
            font-weight: 700;
            min-width: 30px;
            text-align: center;
        }
        .cart-item .item-total {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--yellow);
            min-width: 100px;
            text-align: right;
        }
        .cart-item .btn-remove {
            background: transparent;
            border: 1px solid var(--magenta);
            color: var(--magenta);
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.8rem;
        }
        .cart-item .btn-remove:hover {
            background: var(--magenta);
            color: #0a0a0f;
        }
        .cart-summary {
            background: var(--bg-secondary);
            border: var(--border-neon);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .cart-summary .total-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }
        .cart-summary .total-price {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--yellow);
            text-shadow: 0 0 20px rgba(255, 230, 0, 0.2);
        }
        .cart-summary .btn-checkout {
            padding: 14px 48px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #0a0a0f;
            background: var(--yellow);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(255, 230, 0, 0.2);
        }
        .cart-summary .btn-checkout:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 230, 0, 0.4);
        }
        .cart-summary .discount-info {
            font-size: 0.9rem;
            color: var(--cyan);
            width: 100%;
            text-align: center;
        }
        .footer {
            margin-top: auto;
            padding: 40px 0 20px;
            border-top: var(--border-neon);
            background: var(--bg-secondary);
        }
        .footer .container {
            max-width: 1200px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 30px;
        }
        .footer-col h4 {
            font-family: 'Orbitron', sans-serif;
            font-weight: 400;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .footer-col p,
        .footer-col a {
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 6px;
        }
        .footer-col a:hover {
            color: var(--cyan);
        }
        .footer-bottom {
            text-align: center;
            padding-top: 30px;
            border-top: var(--border-neon);
            margin-top: 30px;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .glitch-text {
            display: inline-block;
            position: relative;
        }
        .glitch-text:hover {
            animation: glitch 0.3s ease-in-out;
        }
        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(2deg) translateX(2px); color: var(--magenta); }
            40% { transform: skew(-2deg) translateX(-2px); color: var(--cyan); }
            60% { transform: skew(1deg) translateX(1px); }
            80% { transform: skew(-1deg) translateX(-1px); }
            100% { transform: skew(0deg); }
        }
        @media (max-width: 768px) {
            .nav-links { gap: 15px; font-size: 0.9rem; }
            .logo { font-size: 1.4rem; }
            .cart-header h1 { font-size: 1.8rem; }
            .cart-item { flex-direction: column; align-items: stretch; text-align: center; }
            .cart-item .item-total { text-align: center; }
            .cart-summary { flex-direction: column; text-align: center; }
        }
        @media (max-width: 480px) {
            .navbar .container { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo">NeonRide</div>
            <nav class="nav-links">
                <a href="index.html">Главная</a>
                <a href="Categories.html">Магазин</a>
                <a href="Promotions.html">Акции</a>
                <a href="About.html">О нас</a>
                <a href="Account.html">Аккаунт</a>
                <a href="Admin.html">Админ</a>
            </nav>
            <a href="Cart.html" class="cart-icon">
                🛒
                <span class="cart-badge" id="cartBadge">0</span>
            </a>
        </div>
    </header>

    <section class="cart-header">
        <div class="container">
            <h1 class="glitch-text">🛒 Корзина</h1>
        </div>
    </section>

    <section class="cart-content">
        <div class="container">
            <div id="cartContainer"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-col">
                <h4>NeonRide</h4>
                <p>Скорость, стиль, свобода.</p>
                <p>© 2026 Все права защищены.</p>
            </div>
            <div class="footer-col">
                <h4>Контакты</h4>
                <a href="mailto:info@neonride.tech">info@neonride.tech</a>
                <a href="tel:+71234567890">+7 (123) 456-78-90</a>
            </div>
            <div class="footer-col">
                <h4>Соцсети</h4>
                <a href="#">Telegram</a>
                <a href="#">VK</a>
                <a href="#">YouTube</a>
            </div>
        </div>
        <div class="footer-bottom">
            <span class="glitch-text">#RideTheFuture</span>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD604DaYFZFDxyXficUMk5o6vjoeDTP--c",
            authDomain: "neonride-7f3ec.firebaseapp.com",
            projectId: "neonride-7f3ec",
            storageBucket: "neonride-7f3ec.firebasestorage.app",
            messagingSenderId: "439881566114",
            appId: "1:439881566114:web:3ae85a145f524f50ead4fb",
            measurementId: "G-WCWH5H151L"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const badge = document.getElementById('cartBadge');
            if (badge) {
                const total = cart.reduce((sum, item) => sum + item.quantity, 0);
                badge.textContent = total;
            }
        }
        updateCartBadge();
        window.addEventListener('focus', updateCartBadge);

        function renderCart() {
            const container = document.getElementById('cartContainer');
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const discount = parseInt(localStorage.getItem('userDiscount')) || 0;
            const bonus = parseInt(localStorage.getItem('userBonuses')) || 0;

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty">
                        <p>🛒 Ваша корзина пуста</p>
                        <a href="Categories.html" class="btn-primary">Перейти в магазин</a>
                    </div>
                `;
                updateCartBadge();
                return;
            }

            let html = `<div class="cart-items">`;
            let total = 0;

            cart.forEach((item, index) => {
                const priceNum = parseInt(item.price.replace(/\D/g, ''));
                const itemTotal = priceNum * item.quantity;
                total += itemTotal;

                html += `
                    <div class="cart-item" data-index="${index}">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <div class="item-price">${item.price}</div>
                        </div>
                        <div class="item-qty">
                            <button onclick="changeQty(${index}, -1)">−</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <div class="item-total">${itemTotal.toLocaleString()} ₽</div>
                        <button class="btn-remove" onclick="removeItem(${index})">✕ Удалить</button>
                    </div>
                `;
            });

            html += `</div>`;

            let finalTotal = total;
            let discountApplied = 0;
            let bonusApplied = 0;

            if (discount > 0) {
                discountApplied = Math.round(total * discount / 100);
                finalTotal -= discountApplied;
            }
            if (bonus > 0 && finalTotal > 0) {
                bonusApplied = Math.min(bonus, finalTotal);
                finalTotal -= bonusApplied;
            }

            html += `
                <div class="cart-summary">
                    <span class="total-label">ИТОГО</span>
                    <span class="total-price">${finalTotal.toLocaleString()} ₽</span>
                    <button class="btn-checkout" onclick="checkout()">Оформить заказ</button>
                    ${discount > 0 ? `<div class="discount-info">Скидка ${discount}%: -${discountApplied} ₽</div>` : ''}
                    ${bonus > 0 && bonusApplied > 0 ? `<div class="discount-info">Бонусы: -${bonusApplied} ₽</div>` : ''}
                </div>
            `;

            container.innerHTML = html;
            updateCartBadge();
        }

        function changeQty(index, delta) {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart[index]) {
                cart[index].quantity += delta;
                if (cart[index].quantity <= 0) {
                    cart.splice(index, 1);
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        function removeItem(index) {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        async function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            if (cart.length === 0) return;

            const user = auth.currentUser;
            if (!user) {
                alert('Для оформления заказа войдите в аккаунт');
                window.location.href = 'Account.html';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                total += parseInt(item.price.replace(/\D/g, '')) * item.quantity;
            });

            const discount = parseInt(localStorage.getItem('userDiscount')) || 0;
            const bonus = parseInt(localStorage.getItem('userBonuses')) || 0;
            let finalTotal = total;
            if (discount > 0) finalTotal -= Math.round(total * discount / 100);
            if (bonus > 0 && finalTotal > 0) finalTotal -= Math.min(bonus, finalTotal);

            const orderData = {
                userEmail: user.email,
                uid: user.uid,
                items: cart.map(item => ({ name: item.name, price: item.price, quantity: item.quantity })),
                total: finalTotal,
                originalTotal: total,
                discount: discount,
                bonusUsed: Math.min(bonus, finalTotal),
                status: 'pending',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                const docRef = await db.collection('orders').add(orderData);

                let newBonuses = parseInt(localStorage.getItem('userBonuses')) || 0;
                const earned = Math.floor(finalTotal * 0.05);
                newBonuses += earned;
                await db.collection('users').doc(user.uid).update({
                    bonuses: newBonuses
                });
                localStorage.setItem('userBonuses', newBonuses);

                localStorage.setItem('cart', '[]');
                renderCart();

                const container = document.getElementById('cartContainer');
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 0;">
                        <div style="font-size: 4rem; margin-bottom: 20px;">✅</div>
                        <h2 style="font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--cyan);">Заказ оформлен!</h2>
                        <p style="color: var(--text-secondary); font-size: 1.2rem; margin: 20px 0;">
                            Спасибо за покупку! Сумма заказа: <strong style="color: var(--yellow);">${finalTotal.toLocaleString()} ₽</strong>
                            <br />Начислено бонусов: <strong style="color: var(--yellow);">${earned}</strong>
                        </p>
                        <a href="Categories.html" class="btn-primary" style="display: inline-block; margin-top: 30px; padding: 14px 40px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: #0a0a0f; background: var(--cyan); border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; box-shadow: var(--glow-cyan);">Продолжить покупки</a>
                    </div>
                `;
                updateCartBadge();
            } catch (err) {
                alert('Ошибка при оформлении заказа: ' + err.message);
                console.error(err);
            }
        }

        renderCart();

        document.querySelectorAll('.glitch-text').forEach(el => {
            el.addEventListener('mouseenter', function() {
                this.style.animation = 'none';
                setTimeout(() => this.style.animation = 'glitch 0.3s ease-in-out', 10);
            });
        });

        window.addEventListener('focus', renderCart);
    </script>
</body>
</html>
